services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  thread-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thread_user
      POSTGRES_PASSWORD: thread_pass
      POSTGRES_DB: thread_db
    ports:
      - "5434:5432"
    volumes:
      - thread_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  auth_db_data:
  thread_db_data: