syntax = "proto3";

package auth;

option go_package = "github.com/vaniakarlita/ay-com/backend/auth-service/authpb";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendCode(ResendCodeRequest) returns (ResendCodeResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetSecurityQuestion(GetSecurityQuestionRequest) returns (GetSecurityQuestionResponse);
  rpc VerifySecurityAnswer(VerifySecurityAnswerRequest) returns (VerifySecurityAnswerResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc GoogleAuth(GoogleAuthRequest) returns (GoogleAuthResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc GetProfileByUsername(GetProfileByUsernameRequest) returns (GetProfileResponse);
  rpc GetProfilesByIDs(GetProfilesByIDsRequest) returns (GetProfilesByIDsResponse);
}

message RegisterRequest {
  string name = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  string gender = 5;
  string date_of_birth = 6;
  string profile_picture_url = 7;
  string banner_url = 8;
  string security_question = 9;
  string security_answer = 10;
  bool newsletter = 11;
}

message RegisterResponse {
  string user_id = 1;
  string message = 2;
}

message VerifyEmailRequest {
  string email = 1;
  string code = 2;
}

message VerifyEmailResponse {
  string message = 1;
}

message ResendCodeRequest {
  string email = 1;
}

message ResendCodeResponse {
  string message = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  string message = 1;
}

message GetSecurityQuestionRequest {
  string email = 1;
}

message GetSecurityQuestionResponse {
  string question = 1;
}

message VerifySecurityAnswerRequest {
  string email = 1;
  string answer = 2;
}

message VerifySecurityAnswerResponse {
  string reset_token = 1;
}

message ResetPasswordRequest {
  string email = 1;
  string reset_token = 2;
  string new_password = 3;
}

message ResetPasswordResponse {
  string message = 1;
}

message GoogleAuthRequest {
  string id_token = 1;
}

message GoogleAuthResponse {
  bool registered = 1;
  string access_token = 2;
  string refresh_token = 3;
  string email = 4;
  string name = 5;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  string user_id = 1;
  string name = 2;
  string username = 3;
  string profile_picture_url = 4;
}

message GetProfileByUsernameRequest {
  string username = 1;
}

message GetProfilesByIDsRequest {
  repeated string user_ids = 1;
}

message GetProfilesByIDsResponse {
  repeated GetProfileResponse profiles = 1;
}