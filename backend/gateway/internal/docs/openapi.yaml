openapi: 3.0.3
info:
  title: AY.com API
  version: 1.0.0
  description: HTTP API gateway for AY.com. All requests are forwarded to the auth-service over gRPC.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Account recovery
  - name: Session
  - name: System
paths:
  /api/health:
    get:
      tags: [System]
      summary: Health check
      responses:
        "200":
          description: Gateway is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new account and send a verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created, verification code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/auth/verify:
    post:
      tags: [Auth]
      summary: Verify email with the 5 minute code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  example: adrian.yu@gmail.com
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/auth/resend-code:
    post:
      tags: [Auth]
      summary: Send a new verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/login:
    post:
      tags: [Session]
      summary: Log in and receive access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: adrian.yu@gmail.com
                password:
                  type: string
                  example: Abcdef1!
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/auth/refresh:
    post:
      tags: [Session]
      summary: Exchange a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      tags: [Session]
      summary: Invalidate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/me:
    get:
      tags: [Session]
      summary: Get the current user id from the access token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/forgot/question:
    post:
      tags: [Account recovery]
      summary: Get the security question of a registered, non-banned email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Security question
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    type: string
                    example: What was the name of your first pet?
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/forgot/verify:
    post:
      tags: [Account recovery]
      summary: Check the security answer and receive a reset token valid for 10 minutes
      description: Limited to 5 wrong answers per 15 minutes per email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, answer]
              properties:
                email:
                  type: string
                answer:
                  type: string
      responses:
        "200":
          description: Reset token
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/forgot/reset:
    post:
      tags: [Account recovery]
      summary: Set a new password using the reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, resetToken, newPassword]
              properties:
                email:
                  type: string
                resetToken:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          example: adrian.yu@gmail.com
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    Tokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    RegisterRequest:
      type: object
      required:
        - name
        - username
        - email
        - password
        - gender
        - dateOfBirth
        - profilePictureUrl
        - bannerUrl
        - securityQuestion
        - securityAnswer
      properties:
        name:
          type: string
          example: Adrian Yu
        username:
          type: string
          example: adrian
        email:
          type: string
          example: adrian.yu@gmail.com
        password:
          type: string
          example: Abcdef1!
        gender:
          type: string
          enum: [male, female]
        dateOfBirth:
          type: string
          example: "2000-01-31"
        profilePictureUrl:
          type: string
        bannerUrl:
          type: string
        securityQuestion:
          type: string
          example: What was the name of your first pet?
        securityAnswer:
          type: string
        newsletter:
          type: boolean
  responses:
    Message:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    BadRequest:
      description: Invalid request body or validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Invalid credentials, answer, or token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Account is banned or not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Email or username already used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Precondition failed, for example the account is not verified
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"