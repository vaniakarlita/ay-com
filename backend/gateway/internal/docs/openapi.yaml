openapi: 3.0.3
info:
  title: AY.com API
  version: 1.0.0
  description: HTTP API gateway for AY.com. Requests are forwarded to the microservices over gRPC.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Registration
  - name: Session
  - name: Password recovery
  - name: Uploads
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check that the gateway is running
      responses:
        "200":
          description: Gateway is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/register:
    /api/uploads/image:
    post:
      tags: [Uploads]
      summary: Upload a profile picture or banner (max 2 MB; JPEG, PNG, GIF, WebP)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  type: string
                  enum: [profile, banner]
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [Registration]
      summary: Create an account and send a verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created, verification code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/auth/verify:
    post:
      tags: [Registration]
      summary: Activate an account with the emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  example: adrian.yu@gmail.com
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Verification code expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/resend-code:
    post:
      tags: [Registration]
      summary: Send a new verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Account is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/login:
    post:
      tags: [Session]
      summary: Sign in and receive access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: adrian.yu@gmail.com
                password:
                  type: string
                  format: password
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Account is not verified, banned, or deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/refresh:
    post:
      tags: [Session]
      summary: Exchange a refresh token for a new token pair (single use)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/Tokens"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      tags: [Session]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/Message"
  /api/me:
    get:
      tags: [Session]
      summary: Get the signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/forgot/question:
    post:
      tags: [Password recovery]
      summary: Get the security question of a registered, non-banned email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Security question
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    type: string
        "403":
          description: Account is banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/forgot/verify:
    post:
      tags: [Password recovery]
      summary: Check the security answer and receive a reset token (5 wrong answers lock for 15 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, answer]
              properties:
                email:
                  type: string
                answer:
                  type: string
      responses:
        "200":
          description: Reset token valid for 10 minutes
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/forgot/reset:
    post:
      tags: [Password recovery]
      summary: Set a new password (must differ from the old one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, resetToken, newPassword]
              properties:
                email:
                  type: string
                resetToken:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        "200":
          $ref: "#/components/responses/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          example: adrian.yu@gmail.com
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    RegisterRequest:
      type: object
      required:
        - name
        - username
        - email
        - password
        - gender
        - dateOfBirth
        - profilePictureUrl
        - bannerUrl
        - securityQuestion
        - securityAnswer
      properties:
        name:
          type: string
          description: More than 4 characters, letters and spaces only
          example: Adrian Yu
        username:
          type: string
          description: 3-15 characters, letters, numbers, or underscore. Must be unique.
          example: adrian_yu
        email:
          type: string
          description: Must match name@domain.com. Must be unique.
          example: adrian.yu@gmail.com
        password:
          type: string
          format: password
          description: At least 8 characters with uppercase, lowercase, number, and symbol
          example: Abcdef1!
        gender:
          type: string
          enum: [male, female]
        dateOfBirth:
          type: string
          format: date
          description: User must be at least 13 years old
          example: "2000-01-15"
        profilePictureUrl:
          type: string
        bannerUrl:
          type: string
        securityQuestion:
          type: string
          enum:
            - What was the name of your first pet?
            - What city were you born in?
            - What is your favorite video game?
            - What was the name of your first school?
            - What was your childhood nickname?
        securityAnswer:
          type: string
        newsletter:
          type: boolean
          default: false
  responses:
    Message:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    Tokens:
      description: Access token (15 minutes) and refresh token (7 days)
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken:
                type: string
              refreshToken:
                type: string
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Email is not registered
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Email or username already used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A backend service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"  